-- conf/skynet.conf
-- Skynet 运行时配置
--
-- 用法：
--   make run          → 启动服务（无测试）
--   make test         → 运行所有单元测试
--   make stress       → center 单点吞吐压测
--   make stress-e2e   → 端到端压测（TCP + 协议 + agent）
--
-- 配置键名说明（对应 skynet C 源码中的环境变量键）：
--   cpath      → 主进程 Lua C 库搜索路径（package.cpath 初始值）
--   lua_cpath  → snlua 子进程的 Lua C 库搜索路径
--   luaservice → snlua 子进程的服务搜索路径（LUA_SERVICE）
--   lua_path   → snlua 子进程的 Lua 源文件搜索路径（LUA_PATH）
--   lualoader  → snlua 子进程的 loader 脚本路径
--   logservice → 日志服务类型，默认 "logger"
--   logger     → 日志文件参数，非 nil 时启用
--   bootstrap  → 启动时启动的第一个 snlua 服务
--
-- 业务自定义键（由 runtime.lua 解析，skynet C 层会忽略）：
--   gate_port  → Gate 监听端口
--   maxclient  → 最大连接数（1000 人压测需 > 1024）

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./gateway/?.lua;./test/?.lua;./shared/?.lua;./proto/?.lua;./conf/?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./proto/?.lua;./service/?.lua;./test/?.lua;./gateway/?.lua;./conf/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"
logservice = "logger"
logger   = "ch4.log"
logpath  = "."

thread   = 8
harbor   = 0              -- 单节点，无 harbor
bootstrap = "snlua bootstrap"
start    = "main"

-- 业务配置
gate_address = "0.0.0.0"
gate_port  = 8888
maxclient  = 2048
gate_backlog = 1024
agent_prewarm = 128

-- 测试参数（由 Makefile 通过环境变量 CH4_TEST_TARGET 注入，见 runtime.lua）
-- test_target = "stress_1000"
