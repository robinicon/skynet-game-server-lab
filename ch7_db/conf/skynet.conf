-- conf/skynet.conf — ch7_db 运行时配置

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"
logservice = "logger"
logger   = "ch7.log"
logpath  = "."

thread   = 8
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

-- 业务配置
db_driver     = "memory"   -- memory | mysql（CH7_DB_DRIVER 可覆盖）
db_latency    = 1          -- 模拟网络往返 tick 数（1 tick = 10ms）
db_slow_uid   = 100        -- 该 uid 的操作额外慢 10 倍（隔离性测试）
pool_min      = 1
pool_max      = 8
pool_hard_max = 32

-- MySQL 连接参数（仅 db_driver=mysql 时使用）
-- skynet 的纯 Lua mysql 驱动只支持 mysql_native_password 握手，
-- 故用专用账号 skynet；生产环境请改用环境变量或密钥管理，不要写进配置。
db_host       = "127.0.0.1"
db_port       = 3306
db_user       = "skynet"
db_password   = "skynet123"
db_database   = "ch7_db"

-- test_target = "test_db,test_concurrency"
