-- conf/node_b.conf — 场景节点（scene_b，跨节点跳转目标）

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"

logservice = "logger"
-- logger 不设文件：skynet 日志走 stdout，由 Makefile 的 tee/重定向统一捕获，
-- 避免 logger 写文件与 tee 写同文件双写损坏。
-- logger   = "log/node_b.log"
logpath  = "log"

thread   = 4
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

cluster = "./conf/clustername.lua"

node_name    = "node_b"
cluster_port = 2542
test_target  = ""
