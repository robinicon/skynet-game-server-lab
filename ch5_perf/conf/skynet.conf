-- conf/skynet.conf — ch5_perf 运行时配置
--
-- 用法：
--   make test    — 对象池正确性测试（18 用例）
--   make bench   — 池化 vs 非池化基准 + profiling
--   make profile — 只跑采样 profiler，输出热点函数 Top N
--
-- 配置键名与 ch4_login 保持一致（同一个 monorepo 的通用约定）

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"
logservice = "logger"
logger   = "ch5.log"
logpath  = "."

thread   = 4           -- 基准测试是单服务串行负载，不需要多线程
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

-- 业务配置
bench_rounds   = 100000   -- 基准循环次数
bench_hold     = 64       -- 场景B：同时持有的对象数
pool_max       = 1024     -- 池上限
pool_prewarm   = 32       -- 预热数量

-- 测试参数（由 Makefile 通过环境变量 CH5_TEST_TARGET 注入，见 runtime.lua）
-- test_target = "test_pool"
