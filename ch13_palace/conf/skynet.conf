-- ch13_palace — 抽象数据 + 抽象消息最小工程

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "./clib/?.so;../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./generated/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./lualib/?.lua;./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;./generated/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"
logservice = "logger"
-- logger 不设文件：日志走 stdout，由 Makefile 的 tee 统一捕获，避免双写损坏
-- logger   = "log/ch13.log"
logpath   = "."

thread   = 4
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

snapshot_path = "data/snapshot.json"

-- 阶段 1：TCP 网关监听（可用 CH13_GATE_PORT / CH13_GATE_ADDRESS 覆盖）
gate_address = "127.0.0.1"
gate_port    = 9813
maxclient    = 256
backlog      = 256

-- P0：WebSocket 网关（Unity / 微信小游戏入口，可用 CH13_WS_PORT / CH13_WS_ADDRESS 覆盖）
-- 与 gate_port 并存；wss 由外层 nginx 终止 TLS，这里收明文 ws
ws_gate_address = "127.0.0.1"
ws_gate_port    = 9814

-- 阶段 3：断线重连窗口（0.01s 单位），可用 CH13_SESSION_GRACE 覆盖
session_grace = 300

-- 阶段 2：抽象存储驱动（memory / mysql），可用 CH13_DB_* 环境变量覆盖
db_driver    = "memory"
db_host      = "127.0.0.1"
db_port      = 3306
db_user      = "dev"
db_password  = "dev123"
db_name      = "ch13_palace"

-- test_target 由 CH13_TEST_TARGET 环境变量注入，skynet 不解析 --key=value 参数
