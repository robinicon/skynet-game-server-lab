-- conf/node.conf — ch12 单节点（断线重连 + 热更新）
-- 本议题不需要 cluster，单进程内即可演示断线延迟销毁与热更广播。

root      = "./"
cpath     = "../skynet/cservice/?.so"
lua_cpath = "../skynet/luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"

logservice = "logger"
-- logger 不设文件：让 skynet 日志走 stdout，由 Makefile 的 `| tee log/node.log` 统一捕获，
-- 避免「logger 写文件 + tee 写同文件」双写导致日志行互相覆盖损坏。
-- logger = "log/node.log"
logpath  = "log"

thread   = 4
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

node_name    = "node_a"
test_target  = "test_all"
