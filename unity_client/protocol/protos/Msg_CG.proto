syntax = "proto2";
package Msg_CG;
import "Msg_Common.proto";
// 客户端↔GameServer · 首版最小集（只增不改地长）

// ── 版本协商（v3 新增，C1 审计整改）──
// 客户端上线前必须完成版本门禁：assembly / lua / config / resource 四版本 + 服务器判定
message VersionCheckReq {
  optional string client_version   = 1;  // 壳工程语义版本，格式 "m.m.m"
  optional uint32 assembly_version = 2;  // HybridCLR 热更程序集哈希版本号
  optional uint32 lua_version      = 3;  // xLua 脚本包版本号
  optional uint32 config_version   = 4;  // share_data/server_data hash
  optional uint32 resource_version = 5;  // YooAsset AB bundle hash
  optional string channel          = 6;  // 渠道名 guest/wx/taptap...
}

message VersionCheckRsp {
  optional Msg_Common.ErrCode err             = 1;
  optional bool     force_update              = 2;  // true = 强更（下载新版壳），false = 允许进入
  optional string   update_url                = 3;  // 强更时的安装包 URL
  optional string   notice                    = 4;  // 维护公告/提示信息
  optional uint32   required_assembly_version = 5;
  optional uint32   required_lua_version      = 6;
  optional uint32   required_config_version   = 7;
  optional uint32   required_resource_version = 8;
}

message Heartbeat { optional uint64 client_time = 1; }
message HeartbeatAck { optional uint64 server_time = 1; }

message EnterGameReq {
  optional uint64 uid = 1;
  optional uint32 server_id = 2;
  optional uint64 role_id = 3;      // 0=无角色需创建
}
message EnterGameRsp {
  optional Msg_Common.ErrCode err = 1;
  optional uint64 role_id = 2;
  optional uint32 scene_id = 3;
  optional Msg_Common.Vec3 pos = 4;
}

// 通用属性同步 · 泳道白名单投影 · 客户端按 share_data 字段定义表解释
message SyncProps {
  optional Msg_Common.EntityId entity = 1;
  repeated Msg_Common.PropValue values = 2;   // 只带 dirty 槽位
}

message MoveReq {
  optional Msg_Common.Vec3 from = 1;
  optional Msg_Common.Vec3 to = 2;
  optional float speed = 3;
}
message MoveSync {
  optional Msg_Common.EntityId entity = 1;
  optional Msg_Common.Vec3 pos = 2;
  optional Msg_Common.Vec3 dir = 3;
}

// 战斗 · S3 · 伤害计算在服务器，客户端只发意图收结果
message AttackReq {
  optional uint64 attacker = 1;   // 实体 id（服务器校验归属）
  optional uint64 target = 2;
  optional uint32 skill_id = 3;   // 技能定义表槽位（share_data）
}
message AttackRsp {
  optional Msg_Common.ErrCode err = 1;
  optional int64 target_hp = 2;   // 攻击后目标 HP（攻击者视角确认）
  optional int64 damage = 3;
  optional bool  critical = 4;
}
message AttackSync {
  optional uint64 attacker = 1;
  optional uint64 target = 2;
  optional int64 damage = 3;
  optional bool  critical = 4;
  optional int64 target_hp = 5;   // 广播给同场景其它观察者
}
