syntax = "proto2";
package Msg_Common;
// 公共结构 · 字段只增不改号

message Vec3 {
  optional float x = 1;
  optional float y = 2;
  optional float z = 3;
}

message EntityId {
  optional uint64 value = 1;      // 高32位=场景id 低32位=实体序号
}

// Props 泳道白名单投影的最小同步单元
// 槽位类型: 1=int64 2=string 3=bitflag
message PropValue {
  optional uint32 slot = 1;       // 槽位号（share_data 字段定义表解释）
  optional int64  num = 2;        // 数值通道
  optional string str = 3;        // 字符串通道
  optional uint64 bits = 4;       // 位属性通道
}

// 统一错误码 · 只增不改
enum ErrCode {
  ERR_OK = 0;
  ERR_TICKET_INVALID = 1;
  ERR_TICKET_EXPIRED = 2;
  ERR_TICKET_REPLAY = 3;
  ERR_SERVER_FULL = 4;
  ERR_ROLE_NOT_FOUND = 5;
  ERR_DB_TIMEOUT = 6;
}
