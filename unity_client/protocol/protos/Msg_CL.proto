syntax = "proto2";
package Msg_CL;
import "Msg_Common.proto";
// 客户端↔登录/选服 · 首版最小集

message SelectServerReq {
  optional string ticket = 1;       // 认证服签发
  optional uint32 server_id = 2;
}

message SelectServerRsp {
  optional Msg_Common.ErrCode err = 1;
  optional string gate_host = 2;
  optional uint32 gate_port = 3;
  optional bytes gate_session_key = 4;  // 会话密钥（Ticket 验证后派生）
}
