-- conf/skynet.conf — ch6_ecs 运行时配置
--
-- 用法：
--   make       — 编译 luaclib/ecs_high.so
--   make test  — ECS 行为测试 + 性能基准
--   make bench — 只跑基准

root      = "./"
cpath     = "../skynet/cservice/?.so;./luaclib/?.so"
lua_cpath = "../skynet/luaclib/?.so;./luaclib/?.so"
luaservice = "./service/?.lua;./test/?.lua;./shared/?.lua;./?.lua;../skynet/service/?.lua"
lua_path  = "./?.lua;./shared/?.lua;./service/?.lua;./test/?.lua;../skynet/lualib/?.lua;../skynet/lualib/?/init.lua"
lualoader = "../skynet/lualib/loader.lua"
logservice = "logger"
logger   = "ch6.log"
logpath  = "."

thread   = 4
harbor   = 0
bootstrap = "snlua bootstrap"
start    = "main"

-- 业务配置
entity_count = 1000
ticks        = 1000
frame_dt     = 0.016
world_bound  = 1000.0

-- 测试参数（由 Makefile 通过 CH6_TEST_TARGET 注入）
-- test_target = "test_ecs"
